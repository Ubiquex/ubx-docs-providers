name: ci

# Matches the same real build check every sibling repo in this org
# already has. Runs the real fetch-docs.mjs (a real network call
# against every configured provider's own GitHub Release, no mock) as
# part of `npm run build`'s own prebuild step -- a checksum failure or
# a missing release asset fails this the same way it would fail a real
# deploy, not silently.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Set up Deno
        # Required by build-examples.mjs, which shells out to `deno fmt`.
        # Missing here since this workflow was written, which is why every
        # main run from 2026-09-03 onward failed. See deploy.yml's own
        # copy of this step for why the error message misdirected.
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: "2.x"

      - name: npm ci
        run: npm ci

      - name: lint
        run: npm run lint

      - name: build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build
